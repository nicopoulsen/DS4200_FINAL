<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>D3 Bar Chart – Car Price Analysis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: white !important; 
      font-family: Arial, sans-serif;
    }

    #chart-wrapper {
      background-color: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      max-width: 1000px;
      margin: auto;
    }

    h2 {
      text-align: center;
      color: #5a2d82;
      margin-bottom: 20px;
    }

    .bar {
      fill: steelblue;
    }

    .bar:hover {
      fill: orange;
    }

    .axis-label {
      font-size: 14px;
    }

    .tooltip {
      position: absolute;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
      visibility: hidden;
      pointer-events: none;
    }

    #controls {
      margin-bottom: 20px;
      text-align: center;
    }

    select {
      font-size: 14px;
      padding: 6px 10px;
      margin: 0 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <div id="chart-wrapper">

    <div id="controls">
      <label for="condition">Car Condition:</label>
      <select id="condition">
        <option value="all">All</option>
        <option value="newer">Newer (≤5 years old)</option>
        <option value="older">Older (>5 years old)</option>
      </select>

      <label for="feature">Group By:</label>
      <select id="feature">
        <option value="Brand">Brand</option>
        <option value="Model">Model</option>
        <option value="Year">Year</option>
        <option value="Transmission">Transmission</option>
        <option value="Fuel_Type">Fuel Type</option>
        <option value="Engine_Size">Engine Size</option>
        <option value="Doors">Doors</option>
        <option value="Owner_Count">Owner Count</option>
      </select>
    </div>

    <svg width="900" height="500"></svg>
  </div>

  <div class="tooltip"></div>

  <script src="../d3/d3_barplot.js"></script>
</body>
</html>
